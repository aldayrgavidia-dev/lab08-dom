
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestor de tareas pendientes</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 640px;
      margin: 30px auto;
    }

    section {
      border: 1px solid #ccc;
      padding: 12px;
      margin-bottom: 16px;
    }

    li {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>Mi gestor de tareas pendientes</h1>

  <section>
    <h2>Agregar tarea</h2>

    <form id="formulario">
      <input id="nombre" type="text" placeholder="Nombre de la tarea" required>

      <select id="prioridad">
        <option value="Alta">Alta</option>
        <option value="Media">Media</option>
        <option value="Baja">Baja</option>
      </select>

      <button type="submit">Agregar tarea</button>
    </form>
  </section>

  <section>
    <h2>Lista de tareas</h2>
    <ul id="listaTareas"></ul>
  </section>

  <script src="app.js"></script>
</body>
</html>
